<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#050608">
  <meta name="description" content="AstraNumerics - High-precision offline Sacred Numerology PWA Observatory. Explore Life Path, Lo Shu grid mandala, Synastry compatibility, and Daily Solfeggio Forecasts.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AstraNumerics">
  
  <title>AstraNumerics | Sacred Observatory & Cosmic Charts</title>

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="apple-touch-icon" href="/icons/icon.svg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>
  <!-- Ambient Cosmic Starfield Canvas -->
  <canvas id="cosmic-canvas"></canvas>

  <!-- PWA Installation Banner -->
  <div id="pwa-install-banner" class="pwa-banner hidden">
    <div class="pwa-banner-content">
      <img src="/icons/icon.svg" alt="AstraNumerics Icon" class="pwa-banner-icon">
      <div class="pwa-banner-text">
        <strong>Install AstraNumerics PWA</strong>
        <span>Get instant offline access to your sacred numerology observatory on mobile & desktop.</span>
      </div>
    </div>
    <div class="pwa-banner-actions">
      <button id="pwa-install-btn" class="btn-primary btn-sm">Install App</button>
      <button id="pwa-dismiss-btn" class="btn-ghost btn-sm">Later</button>
    </div>
  </div>

  <!-- Header Navigation -->
  <header class="app-header" id="app-header"></header>

  <!-- Main Content Area -->
  <main class="app-container" id="app-container">
    <!-- Hero / Calculator Input Section -->
    <section id="hero-section" class="hero-section"></section>

    <!-- Tab Content Panes -->
    <div class="tab-content" id="tab-content">
      <div id="pane-reading" class="tab-pane active"></div>
      <div id="pane-loshu" class="tab-pane"></div>
      <div id="pane-synastry" class="tab-pane"></div>
      <div id="pane-namelab" class="tab-pane"></div>
      <div id="pane-forecast" class="tab-pane"></div>
      <div id="pane-address" class="tab-pane"></div>
      <div id="pane-vault" class="tab-pane"></div>
    </div>
  </main>

  <!-- Interactive Astrolabe Bottom Navigation Bar -->
  <div id="astrolabe-nav-container"></div>

  <!-- Footer -->
  <footer class="app-footer">
    <div class="footer-content">
      <p>✨ <strong>AstraNumerics Observatory</strong> • Sacred Geometry & High-Precision Numerology</p>
      <p class="footer-subtext">100% Client-Side Privacy • Pythagorean & Chaldean Engines • Installable PWA</p>
    </div>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
